<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omar Abidi Apps</title>
<meta name="description" content="Apps by Omar Abidi, including Kawaii Coloring Book: Cute Art.">
<style>
  :root { --bg:#fff8f3; --ink:#3a1f5d; --muted:#6f5a86; --accent:#e8508a; --card:#fff; --line:#f0e2ea; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1424; --ink:#f6eefc; --muted:#c4b3d6; --accent:#ff7fae; --card:#261c31; --line:#3a2d48; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.6 ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:640px; margin:0 auto; padding:56px 16px; }
  h1 { font-size:32px; margin:0 0 4px; }
  p { color:var(--muted); margin:0; }
  .app { margin-top:32px; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:22px 24px; }
  .app h2 { margin:0 0 6px; font-size:20px; }
  a { color:var(--accent); font-weight:700; }
  .links { display:flex; gap:18px; flex-wrap:wrap; margin-top:12px; }
</style>
</head>
<body>
<main>
  <h1>Omar Abidi</h1>
  <p>Independent app developer. Contact: contact.omarabidi@gmail.com</p>
  <div class="app">
    <h2>Kawaii Coloring Book: Cute Art</h2>
    <p>A calm coloring app with cozy puppies, kittens and chicks. Your paint always stays inside the lines.</p>
    <div class="links">
      <a href="https://apps.apple.com/app/id6760699845">View on the App Store</a>
      <a href="/support/">Support</a>
    </div>
  </div>
</main>
</body>
</html>
